<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogo da Velha</title>
  <style>
/* ==========================================================
   Jogo da Velha — visual "duelo de cores"
   A página inteira assume a cor do jogador da vez.
   Todos os pares texto/fundo respeitam contraste >= 4.5:1.
   ========================================================== */
:root {
  --x: #3b2fd9;          /* índigo */
  --o: #c01f58;          /* framboesa */
  --draw: #334155;
  --ink: #0f172a;
  --tile: #f1f5f9;
  --win-bg: #bbf7d0;
  --win-line: #15803d;
  --win-ink: #14532d;
  --focus: #fde047;
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--font);
  color: #fff;
  background-color: var(--bg, var(--x));
  background-image:
    radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.22), transparent 38%),
    radial-gradient(circle at 92% 96%, rgba(0, 0, 0, 0.32), transparent 46%);
  background-attachment: fixed;
  transition: background-color 0.45s ease;
}
body[data-theme="x"] { --bg: var(--x); }
body[data-theme="o"] { --bg: var(--o); }
body[data-theme="draw"] { --bg: var(--draw); }

/* ---------- Layout ---------- */
.app {
  display: grid;
  gap: 16px;
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 24px 16px 40px;
  grid-template-areas: "head" "score" "status" "stage" "actions" "hint";
}
.head { grid-area: head; }
.scoreboard { grid-area: score; }
.status { grid-area: status; }
.stage { grid-area: stage; }
.actions { grid-area: actions; }
.hint { grid-area: hint; }

.head h1 {
  margin: 0 0 6px;
  font-family: "Segoe UI Black", "Arial Black", var(--font);
  font-size: clamp(2.2rem, 10vw, 3.6rem);
  font-weight: 900;
  letter-spacing: -0.03em;
  line-height: 1;
}
.head p { margin: 0; font-size: 1.05rem; }

/* ---------- Placar ---------- */
.scoreboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.score {
  display: grid;
  justify-items: center;
  gap: 2px;
  padding: 10px 4px 12px;
  border-radius: 18px;
  background: rgba(0, 0, 0, 0.26);
  transition: background-color 0.3s ease, color 0.3s ease, transform 0.3s ease;
}
.score__icon {
  width: 30px;
  height: 30px;
  fill: none;
  stroke: currentColor;
  stroke-width: 12;
  stroke-linecap: round;
}
.score__value { font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.score__label { font-size: 0.85rem; font-weight: 600; }
/* Jogador da vez: cartão branco com a cor do tema */
.score.is-active { background: #fff; color: var(--bg); transform: translateY(-4px); }

/* ---------- Status ---------- */
.status {
  margin: 0;
  padding: 12px 20px;
  justify-self: center;
  text-align: center;
  font-size: 1.15rem;
  font-weight: 800;
  background: #fff;
  border-radius: 999px;
}
.status--x { color: var(--x); }
.status--o { color: var(--o); }
.status--won { background: var(--win-bg); color: var(--win-ink); }
.status--draw { background: #e2e8f0; color: var(--ink); }

/* ---------- Tabuleiro ---------- */
.stage {
  padding: 12px;
  background: rgba(255, 255, 255, 0.96);
  border-radius: 32px;
  box-shadow: 0 24px 48px rgba(0, 0, 0, 0.3), 0 4px 0 rgba(0, 0, 0, 0.12);
}
.board-area { position: relative; width: 100%; aspect-ratio: 1; }
.board { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); }

.cell {
  position: relative;
  display: grid;
  place-items: center;
  min-width: 0;
  min-height: 0;
  padding: 0;
  color: var(--ink);
  background: transparent;
  border: 0;
  font: inherit;
  cursor: pointer;
}
.cell::before {
  content: "";
  position: absolute;
  inset: 6px;
  border-radius: 22px;
  background: var(--tile);
  box-shadow: inset 0 -5px 0 rgba(15, 23, 42, 0.08);
  transition: background-color 0.15s ease, transform 0.15s ease;
}
.board:not(.board--over) .cell--empty:hover::before { background: #e2e8f0; transform: scale(0.96); }

/* Pré-visualização da jogada ao pairar */
.board[data-turn="X"]:not(.board--over) .cell--empty:hover::after,
.board[data-turn="O"]:not(.board--over) .cell--empty:hover::after {
  position: relative;
  font-size: clamp(2.5rem, 15vw, 4.5rem);
  opacity: 0.28;
}
.board[data-turn="X"]:not(.board--over) .cell--empty:hover::after { content: "X"; color: var(--x); font-weight: 900; }
.board[data-turn="O"]:not(.board--over) .cell--empty:hover::after { content: "O"; color: var(--o); font-weight: 400; }

/* X e O são desenhados traço a traço (forma + cor, nunca só cor) */
.cell__svg {
  position: relative;
  width: 66%;
  height: 66%;
  overflow: visible;
  fill: none;
  stroke-linecap: round;
  stroke-width: 13;
  pointer-events: none;
}
.mark-x, .mark-o { display: none; }
.cell--x .mark-x, .cell--o .mark-o { display: inline; }
.mark-x { stroke: var(--x); }
.mark-o { stroke: var(--o); stroke-width: 11; }
.mark-x line, .mark-o { stroke-dasharray: 1; stroke-dashoffset: 0; }
.cell--x .mark-x line { animation: draw 0.28s ease-out backwards; }
.cell--x .mark-x line:nth-child(2) { animation-delay: 0.14s; }
.cell--o .mark-o { animation: draw 0.45s ease-out backwards; }
@keyframes draw { from { stroke-dashoffset: 1; } }

/* Trinca vencedora: casas verdes, selo ✓ e traço riscando o tabuleiro */
.cell--win::before { background: var(--win-bg); }
.cell--win::after {
  content: "✓";
  position: absolute;
  top: 12px;
  right: 16px;
  font-size: 1.1rem;
  font-weight: 900;
  color: var(--win-ink);
}
.win-line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.win-line line {
  stroke: var(--win-line);
  stroke-width: 0.1;
  stroke-linecap: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  opacity: 0;
}
.win-line line.is-on {
  opacity: 0.92;
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 0.5s ease 0.3s;
}
.board--over .cell { cursor: default; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-7px); }
  75% { transform: translateX(7px); }
}
.shake { animation: shake 0.3s ease-in-out; }

/* ---------- Botões ---------- */
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.btn {
  flex: 1 1 140px;
  min-height: 52px;
  padding: 12px 20px;
  font: inherit;
  font-weight: 800;
  border: 2px solid #fff;
  border-radius: 999px;
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease, transform 0.05s ease;
}
.btn:active { transform: translateY(1px); }
.btn--primary { background: #fff; color: var(--bg); }
.btn--primary:hover { background: #e2e8f0; }
.btn--secondary { background: transparent; color: #fff; }
.btn--secondary:hover { background: rgba(0, 0, 0, 0.25); }

.hint { margin: 0; font-size: 0.9rem; text-align: center; }

/* ---------- Foco por teclado ---------- */
.btn:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
.cell:focus-visible { outline: 4px solid var(--ink); outline-offset: -8px; border-radius: 26px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Responsividade: 360px → desktop ---------- */
@media (min-width: 900px) {
  .app {
    max-width: 1060px;
    padding-top: 56px;
    align-content: start;
    align-items: start;
    column-gap: 56px;
    grid-template-columns: minmax(300px, 1fr) minmax(400px, 540px);
    grid-template-areas:
      "head stage"
      "score stage"
      "status stage"
      "actions stage"
      "hint stage"
      ".   stage";
  }
  .status { justify-self: start; }
  .hint { text-align: left; }
}
</style>
</head>
<body data-theme="x">
  <main class="app">
    <header class="head">
      <h1>Jogo da Velha</h1>
      <p>Dois jogadores, um tabuleiro. O Jogador X sempre começa.</p>
    </header>

    <section class="scoreboard" aria-label="Placar da sessão">
      <div class="score score--x" id="badge-x">
        <svg class="score__icon" viewBox="0 0 100 100" aria-hidden="true"><path d="M24 24L76 76M76 24L24 76"/></svg>
        <strong class="score__value" id="score-x">0</strong>
        <span class="score__label">Vitórias X</span>
      </div>
      <div class="score score--draw">
        <svg class="score__icon" viewBox="0 0 100 100" aria-hidden="true"><path d="M24 38H76M24 62H76"/></svg>
        <strong class="score__value" id="score-draws">0</strong>
        <span class="score__label">Empates</span>
      </div>
      <div class="score score--o" id="badge-o">
        <svg class="score__icon" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="28"/></svg>
        <strong class="score__value" id="score-o">0</strong>
        <span class="score__label">Vitórias O</span>
      </div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div class="stage">
      <div class="board-area">
        <div id="board" class="board" role="group" aria-label="Tabuleiro do jogo da velha"></div>
        <svg class="win-line" viewBox="0 0 3 3" aria-hidden="true">
          <line id="win-line" x1="0" y1="0" x2="0" y2="0" pathLength="1"/>
        </svg>
      </div>
    </div>

    <div class="actions">
      <button type="button" id="btn-new" class="btn btn--primary">Nova partida</button>
      <button type="button" id="btn-reset" class="btn btn--secondary">Zerar placar</button>
    </div>

    <p class="hint">Use Tab para navegar pelas casas e Enter ou Espaço para marcar.</p>
    <noscript><p class="hint">Este jogo precisa de JavaScript ativado para funcionar.</p></noscript>
  </main>

  <script>
'use strict';

/* ==========================================================
   Jogo da Velha — arquitetura MVC (JavaScript puro, ES2020)
   - GameModel:      estado e regras de negócio (sem DOM)
   - GameView:       renderização e eventos do DOM (sem regras)
   - GameController: conecta Model e View
   ========================================================== */
(function () {
  // As 8 combinações vencedoras: 3 linhas, 3 colunas, 2 diagonais (RF05 / RN03)
  const WIN_LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
  ];

  /* ---------------------------- MODEL ---------------------------- */
  class GameModel {
    constructor() {
      this.score = { X: 0, O: 0, draws: 0 };
      this.newRound();
    }

    /** Limpa só o tabuleiro; X começa; placar intacto (RF06, RN01, RN06). */
    newRound() {
      this.board = Array(9).fill(null);
      this.current = 'X';
      this.status = 'playing'; // 'playing' | 'won' | 'draw'
      this.winner = null;
      this.winningLine = [];
    }

    /** Zera as pontuações (RF08). A confirmação é responsabilidade do Controller. */
    resetScore() {
      this.score = { X: 0, O: 0, draws: 0 };
    }

    /** Tenta registrar uma jogada e informa o resultado (RF02, RF03, RF04). */
    play(index) {
      if (!Number.isInteger(index) || index < 0 || index > 8) {
        return { ok: false, reason: 'invalid' };
      }
      if (this.status !== 'playing') {
        return { ok: false, reason: 'finished' }; // RN04: tabuleiro bloqueado
      }
      if (this.board[index] !== null) {
        return { ok: false, reason: 'occupied' }; // RN02: sem sobreposição, turno mantido
      }

      const mark = this.current;
      this.board[index] = mark;

      const line = this.findWinningLine(mark);
      if (line) {
        this.status = 'won';
        this.winner = mark;
        this.winningLine = line;
        this.score[mark] += 1;
      } else if (this.board.every((cell) => cell !== null)) {
        this.status = 'draw'; // RN05
        this.score.draws += 1;
      } else {
        this.current = mark === 'X' ? 'O' : 'X'; // RF03
      }
      return { ok: true, index, mark };
    }

    findWinningLine(mark) {
      return WIN_LINES.find((line) => line.every((i) => this.board[i] === mark)) || null;
    }

    /** Devolve uma cópia do estado, para que a View nunca altere o Model. */
    getState() {
      return {
        board: [...this.board],
        current: this.current,
        status: this.status,
        winner: this.winner,
        winningLine: [...this.winningLine],
        score: { ...this.score }
      };
    }
  }

  /* ---------------------------- VIEW ----------------------------- */
  class GameView {
    constructor() {
      this.boardEl = document.getElementById('board');
      this.statusEl = document.getElementById('status');
      this.scoreEls = {
        X: document.getElementById('score-x'),
        O: document.getElementById('score-o'),
        draws: document.getElementById('score-draws')
      };
      this.newBtn = document.getElementById('btn-new');
      this.resetBtn = document.getElementById('btn-reset');
      this.badgeX = document.getElementById('badge-x');
      this.badgeO = document.getElementById('badge-o');
      this.winLine = document.getElementById('win-line');
      this.cells = [];
      this.audioCtx = null;
      this.buildBoard();
    }

    /** RF01: cria as 9 casas como <button>, sem innerHTML. */
    buildBoard() {
      for (let i = 0; i < 9; i += 1) {
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'cell cell--empty';
        cell.dataset.index = String(i);

        cell.appendChild(this.createMarks());
        this.boardEl.appendChild(cell);
        this.cells.push(cell);
      }
    }

    /** Cria (sem innerHTML) o SVG com os dois desenhos possíveis: X e O. O CSS mostra o correto. */
    createMarks() {
      const NS = 'http://www.w3.org/2000/svg';
      const make = (tag, attrs) => {
        const el = document.createElementNS(NS, tag);
        Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, String(value)));
        return el;
      };
      const svg = make('svg', { viewBox: '0 0 100 100', class: 'cell__svg', 'aria-hidden': 'true' });
      const x = make('g', { class: 'mark-x' });
      x.append(
        make('line', { x1: 24, y1: 24, x2: 76, y2: 76, pathLength: 1 }),
        make('line', { x1: 76, y1: 24, x2: 24, y2: 76, pathLength: 1 })
      );
      const o = make('circle', { class: 'mark-o', cx: 50, cy: 50, r: 28, pathLength: 1 });
      svg.append(x, o);
      return svg;
    }

    onCellActivate(handler) {
      this.boardEl.addEventListener('click', (event) => {
        const cell = event.target.closest('.cell');
        if (cell) handler(Number(cell.dataset.index));
      });
    }
    onNewGame(handler) { this.newBtn.addEventListener('click', handler); }
    onResetScore(handler) { this.resetBtn.addEventListener('click', handler); }

    /** Desenha o estado recebido. `notice` é um aviso opcional (ex.: jogada inválida). */
    render(state, notice) {
      const over = state.status !== 'playing';
      this.boardEl.dataset.turn = state.current;
      this.boardEl.classList.toggle('board--over', over);

      state.board.forEach((mark, i) => {
        const cell = this.cells[i];
        const isWin = state.winningLine.includes(i);
        cell.classList.toggle('cell--empty', mark === null);
        cell.classList.toggle('cell--x', mark === 'X');
        cell.classList.toggle('cell--o', mark === 'O');
        cell.classList.toggle('cell--win', isWin);
        cell.setAttribute('aria-disabled', String(over));
        cell.setAttribute('aria-label', this.describeCell(i, mark, isWin));
      });

      let text;
      let tone;
      if (state.status === 'won') {
        text = `Jogador ${state.winner} venceu a partida!`;
        tone = 'won';
      } else if (state.status === 'draw') {
        text = 'Partida empatada!';
        tone = 'draw';
      } else {
        text = `Vez do Jogador ${state.current}`;
        tone = state.current.toLowerCase();
      }
      this.statusEl.textContent = notice ? `${notice} ${text}` : text;
      this.statusEl.className = `status status--${tone}`;

      // Tema da página: cor do jogador da vez (ou do vencedor); cinza no empate
      document.body.dataset.theme = state.status === 'draw' ? 'draw' : state.current.toLowerCase();
      const active = state.status === 'draw' ? null : state.current;
      this.badgeX.classList.toggle('is-active', active === 'X');
      this.badgeO.classList.toggle('is-active', active === 'O');
      this.renderWinLine(state.winningLine);

      this.scoreEls.X.textContent = String(state.score.X);
      this.scoreEls.O.textContent = String(state.score.O);
      this.scoreEls.draws.textContent = String(state.score.draws);
    }

    /** Risca a trinca vencedora ligando o centro da primeira ao centro da última casa. */
    renderWinLine(line) {
      if (line.length === 0) {
        this.winLine.classList.remove('is-on');
        return;
      }
      const first = line[0];
      const last = line[2];
      this.winLine.setAttribute('x1', String((first % 3) + 0.5));
      this.winLine.setAttribute('y1', String(Math.floor(first / 3) + 0.5));
      this.winLine.setAttribute('x2', String((last % 3) + 0.5));
      this.winLine.setAttribute('y2', String(Math.floor(last / 3) + 0.5));
      this.winLine.classList.add('is-on');
    }

    describeCell(index, mark, isWin) {
      const row = Math.floor(index / 3) + 1;
      const col = (index % 3) + 1;
      let label = `Casa ${index + 1}, linha ${row}, coluna ${col}, `;
      label += mark ? `marcada com ${mark}` : 'vazia';
      if (isWin) label += ', faz parte da trinca vencedora';
      return label;
    }

    /** Alerta visual (tremor) e sonoro para jogada inválida (CT05). */
    signalInvalid(index) {
      this.animate(this.cells[index], 'shake');
      this.beep();
    }

    animate(element, className) {
      element.classList.remove(className);
      void element.offsetWidth; // reinicia a animação
      element.classList.add(className);
      element.addEventListener('animationend', () => element.classList.remove(className), { once: true });
    }

    beep() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!this.audioCtx) this.audioCtx = new AudioContextClass();
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = 180;
        gain.gain.value = 0.05;
        osc.connect(gain);
        gain.connect(this.audioCtx.destination);
        osc.start();
        osc.stop(this.audioCtx.currentTime + 0.12);
      } catch (error) {
        /* Som é opcional: o aviso visual e o texto continuam funcionando. */
      }
    }
  }

  /* ------------------------- CONTROLLER -------------------------- */
  class GameController {
    constructor(model, view) {
      this.model = model;
      this.view = view;
      this.view.onCellActivate((index) => this.handleCell(index));
      this.view.onNewGame(() => this.handleNewGame());
      this.view.onResetScore(() => this.handleResetScore());
      this.refresh();
    }

    handleCell(index) {
      const result = this.model.play(index);
      if (result.ok) {
        this.refresh();
      } else if (result.reason === 'occupied') {
        this.refresh('Jogada inválida: casa ocupada.');
        this.view.signalInvalid(index);
      }
      // Pós-fim ('finished'): nenhuma marca é registrada (CT06).
    }

    handleNewGame() {
      this.model.newRound();
      this.refresh();
    }

    /** RF08 / RN07: só zera depois da confirmação explícita do usuário. */
    handleResetScore() {
      const confirmed = window.confirm('Zerar o placar? Todas as vitórias e empates serão apagados.');
      if (!confirmed) return;
      this.model.resetScore();
      this.model.newRound();
      this.refresh();
    }

    refresh(notice) {
      this.view.render(this.model.getState(), notice);
    }
  }

  new GameController(new GameModel(), new GameView());
})();
</script>
</body>
</html>
